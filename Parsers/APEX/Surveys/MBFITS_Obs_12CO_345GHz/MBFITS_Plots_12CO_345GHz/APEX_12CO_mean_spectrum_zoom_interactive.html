93614196777, 2.0650765895843506, 2.060595750808716, 2.0565602779388428, 2.0527682304382324, 2.0458335876464844, 2.0405778884887695, 2.0329880714416504, 2.0266647338867188, 2.0199038982391357, 2.012704849243164, 2.0074355602264404, 2.002948760986328, 1.9985285997390747, 1.9968897104263306, 1.9963440895080566, 1.9947874546051025, 1.9961110353469849, 1.9968631267547607, 1.998039960861206, 1.9998748302459717, 2.000488758087158, 2.000377655029297, 1.9987695217132568, 1.9976067543029785, 1.995653748512268, 1.9937878847122192, 1.9902724027633667, 1.9859651327133179, 1.9805444478988647, 1.9755570888519287, 1.9733332395553589, 1.9673712253570557, 1.9625945091247559, 1.962613821029663, 1.951688528060913, 1.946815848350525, 1.939286470413208, 1.9310845136642456, 1.9238474369049072, 1.9165748357772827, 1.9097973108291626, 1.8988295793533325, 1.889804720878601, 1.8820432424545288, 1.873561978340149, 1.8652827739715576, 1.8556967973709106, 1.8450260162353516, 1.8377892971038818, 1.8271292448043823, 1.8155903816223145, 1.8031054735183716, 1.7916382551193237, 1.780186653137207, 1.7668906450271606, 1.7547467947006226, 1.7436531782150269, 1.73159658908844, 1.7217074632644653, 1.7106181383132935, 1.7027716636657715, 1.6977920532226562, 1.693081259727478, 1.692315936088562, 1.6901068687438965, 1.6868929862976074, 1.6855499744415283, 1.6847575902938843, 1.683933973312378, 1.6843823194503784, 1.6847176551818848, 1.682992696762085, 1.6805410385131836, 1.679925560951233, 1.6765421628952026, 1.6737902164459229, 1.670514464378357, 1.667913794517517, 1.6635972261428833, 1.6606193780899048, 1.656092882156372, 1.6545525789260864, 1.6506702899932861, 1.6473263502120972, 1.6452393531799316, 1.6419992446899414, 1.6395777463912964, 1.635158658027649, 1.6316107511520386, 1.6267859935760498, 1.6224383115768433, 1.617255449295044, 1.6130486726760864, 1.6078892946243286, 1.602502465248108, 1.5951215028762817, 1.5897152423858643, 1.582631230354309, 1.5744279623031616, 1.563602089881897, 1.5571155548095703, 1.5450553894042969, 1.534026026725769, 1.5221203565597534, 1.5116231441497803], "name": "bb2", "color": "darkorange", "fill": true, "fillcolor": "rgba(255,165,0,0.15)"}];
const vline  = 0.0;
const xLabel = 'LSRK velocity (km/s)';
const yLabel = 'Antenna temperature (x10^14 K)';

const PAD = { l:70, r:20, t:10, b:50 };
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const readout = document.getElementById('readout');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - canvas.getBoundingClientRect().top;
  draw();
}

function dataRange() {
  let xmin=Infinity, xmax=-Infinity, ymin=0, ymax=-Infinity;
  traces.forEach(t => {
    t.x.forEach(v => { if(v<xmin) xmin=v; if(v>xmax) xmax=v; });
    t.y.forEach(v => { if(v>ymax) ymax=v; });
  });
  ymax *= 1.08;
  return {xmin, xmax, ymin, ymax};
}

function toCanvas(xv, yv, r) {
  const W = canvas.width - PAD.l - PAD.r;
  const H = canvas.height - PAD.t - PAD.b;
  const cx = PAD.l + (xv - r.xmin) / (r.xmax - r.xmin) * W;
  const cy = PAD.t + (1 - (yv - r.ymin) / (r.ymax - r.ymin)) * H;
  return [cx, cy];
}

function fromCanvas(cx, cy, r) {
  const W = canvas.width - PAD.l - PAD.r;
  const H = canvas.height - PAD.t - PAD.b;
  const xv = r.xmin + (cx - PAD.l) / W * (r.xmax - r.xmin);
  const yv = r.ymin + (1 - (cy - PAD.t) / H) * (r.ymax - r.ymin);
  return [xv, yv];
}

let mouseX = null, mouseY = null;
let range = null;

function draw(mx, my) {
  range = dataRange();
  const r = range;
  const W = canvas.width - PAD.l - PAD.r;
  const H = canvas.height - PAD.t - PAD.b;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // background
  ctx.fillStyle = 'white';
  ctx.fillRect(PAD.l, PAD.t, W, H);

  // grid
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  const nxTicks = 8, nyTicks = 6;
  for(let i=0; i<=nxTicks; i++) {
    const xv = r.xmin + i*(r.xmax-r.xmin)/nxTicks;
    const [cx] = toCanvas(xv, 0, r);
    ctx.beginPath(); ctx.moveTo(cx, PAD.t); ctx.lineTo(cx, PAD.t+H); ctx.stroke();
  }
  for(let i=0; i<=nyTicks; i++) {
    const yv = r.ymin + i*(r.ymax-r.ymin)/nyTicks;
    const [,cy] = toCanvas(0, yv, r);
    ctx.beginPath(); ctx.moveTo(PAD.l, cy); ctx.lineTo(PAD.l+W, cy); ctx.stroke();
  }

  // axes ticks and labels
  ctx.fillStyle = '#333'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
  for(let i=0; i<=nxTicks; i++) {
    const xv = r.xmin + i*(r.xmax-r.xmin)/nxTicks;
    const [cx] = toCanvas(xv, 0, r);
    ctx.fillText(xv.toFixed(2), cx, PAD.t+H+16);
  }
  ctx.textAlign = 'right';
  for(let i=0; i<=nyTicks; i++) {
    const yv = r.ymin + i*(r.ymax-r.ymin)/nyTicks;
    const [,cy] = toCanvas(0, yv, r);
    ctx.fillText(yv.toFixed(2), PAD.l-6, cy+4);
  }

  // axis titles
  ctx.textAlign = 'center';
  ctx.fillText(xLabel, PAD.l + W/2, canvas.height - 8);
  ctx.save();
  ctx.translate(14, PAD.t + H/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(yLabel, 0, 0);
  ctx.restore();

  // vline
  if(vline !== null) {
    const [cvx] = toCanvas(vline, 0, r);
    ctx.strokeStyle = 'red'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(cvx, PAD.t); ctx.lineTo(cvx, PAD.t+H); ctx.stroke();
    ctx.setLineDash([]);
  }

  // traces
  const colors = traces.map(t => t.color);
  traces.forEach(t => {
    ctx.strokeStyle = t.color; ctx.lineWidth = 1.2;
    ctx.beginPath();
    let first = true;
    for(let i=0; i<t.x.length; i++) {
      const [cx,cy] = toCanvas(t.x[i], t.y[i], r);
      if(first) { ctx.moveTo(cx,cy); first=false; } else ctx.lineTo(cx,cy);
    }
    ctx.stroke();

    // fill if requested
    if(t.fill) {
      const [,cy0] = toCanvas(0, 0, r);
      ctx.lineTo(toCanvas(t.x[t.x.length-1], 0, r)[0], cy0);
      ctx.lineTo(toCanvas(t.x[0], 0, r)[0], cy0);
      ctx.closePath();
      ctx.fillStyle = t.fillcolor;
      ctx.fill();
    }
  });

  // legend
  let ly = PAD.t + 12;
  traces.forEach(t => {
    ctx.strokeStyle = t.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PAD.l+10, ly); ctx.lineTo(PAD.l+30, ly); ctx.stroke();
    ctx.fillStyle = '#333'; ctx.textAlign = 'left'; ctx.font = '11px Arial';
    ctx.fillText(t.name, PAD.l+34, ly+4);
    ly += 18;
  });

  // border
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
  ctx.strokeRect(PAD.l, PAD.t, W, H);

  // crosshair
  if(mx !== undefined && mx !== null) {
    const inPlot = mx >= PAD.l && mx <= PAD.l+W && my >= PAD.t && my <= PAD.t+H;
    if(inPlot) {
      // find x from mouse position
      const [xv] = fromCanvas(mx, my, r);
      const snapX = xv;
      const [scx] = toCanvas(snapX, 0, r);

      // vertical crosshair
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(scx, PAD.t); ctx.lineTo(scx, PAD.t+H); ctx.stroke();

      // horizontal crosshair per trace
      traces.forEach(t => {
        let bi=0, bd=Infinity;
        t.x.forEach((v,i) => { const d=Math.abs(v-snapX); if(d<bd){bd=d;bi=i;} });
        const snapY = t.y[bi];
        const [,scy] = toCanvas(snapX, snapY, r);
        ctx.strokeStyle = t.color;
        ctx.beginPath(); ctx.moveTo(PAD.l, scy); ctx.lineTo(PAD.l+W, scy); ctx.stroke();
      });
      ctx.setLineDash([]);

      // readout
      let html = '<b>' + snapX.toFixed(5) + ' ' + xLabel + '</b>';
      traces.forEach(t => {
        let bi=0, bd=Infinity;
        t.x.forEach((v,i) => { const d=Math.abs(v-snapX); if(d<bd){bd=d;bi=i;} });
        html += '<br><span style="color:'+t.color+'"><b>'+t.name+'</b></span>: '+t.y[bi].toFixed(6)+' x10^14 K';
      });
      readout.innerHTML = html;
      readout.style.display = 'block';
    } else {
      readout.style.display = 'none';
    }
  }
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  draw(mouseX, mouseY);
});
canvas.addEventListener('mouseleave', () => {
  mouseX = null; mouseY = null;
  readout.style.display = 'none';
  draw();
});

window.addEventListener('resize', resize);
resize();
</script>
