<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gAPEX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0007a"/>
      <stop offset="100%" stop-color="#8a0055"/>
    </linearGradient>
  </defs>
  <!-- background box -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#gAPEX)" stroke="#5a0038" stroke-width="2"/>
  <!-- top label: APEX -->
  <text x="64" y="40" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold"
        fill="#ffaaee" text-anchor="middle">APEX</text>
  <!-- arrow pointing down -->
  <line x1="64" y1="53" x2="64" y2="67" stroke="#ffcc4d" stroke-width="6" stroke-linecap="round"/>
  <polygon points="54,67 64,83 74,67" fill="#ffcc4d"/>
  <!-- bottom label: FRO -->
  <text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold"
        fill="#ffffff" text-anchor="middle">FRO</text>
</svg>
