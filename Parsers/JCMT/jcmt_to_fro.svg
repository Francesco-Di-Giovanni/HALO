<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gJCMT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a83a12"/>
      <stop offset="100%" stop-color="#7a2908"/>
    </linearGradient>
  </defs>
  <!-- background box: dark burnt orange -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#gJCMT)" stroke="#521a04" stroke-width="2"/>
